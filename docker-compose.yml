version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: ecocalm_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ecocalm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecocalm_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/ecocalm
    depends_on:
      - mongodb
    networks:
      - ecocalm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecocalm_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecocalm_net

networks:
  ecocalm_net:
    driver: bridge

volumes:
  mongo-data:
